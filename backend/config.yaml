server:
  port: 8080

# must_have (per game): a player is starred when all conditions hold —
# top-K owned for their position, >= form_points_min in >= form_ratio of the
# last form_window finished GWs (adaptive when fewer GWs have been played),
# next-GW FDR <= max_next_fdr, and available.
# Note: WCF fixtures always carry FDR 3, so max_next_fdr < 3 disables stars there.

fpl:
  sync_enabled: true
  sync_once: false
  league_id: 314
  odds_enabled: false
  must_have:
    form_window: 5
    form_points_min: 6
    form_ratio: 0.5
    max_next_fdr: 3
    top_gk: 4
    top_def: 8
    top_mid: 8
    top_fwd: 5

# WCF sunset after the 2026 World Cup final. The adapter and mapper stay in the
# codebase (template for the next tournament); we just stop syncing and paying
# The Odds API quota for a dormant game. The game switcher greys out games whose
# data is empty. Flip these back to true when the next WCF/Euros tournament arms.
wcf:
  sync_enabled: false
  odds_enabled: false
  must_have:
    form_window: 5
    form_points_min: 6
    form_ratio: 0.5
    max_next_fdr: 3
    top_gk: 4
    top_def: 8
    top_mid: 8
    top_fwd: 5

odds:
  cache_ttl: 60m

form:
  gw_window: 3

sync:
  # Number of managers whose picks are fetched in parallel during a sync.
  picks_workers: 10
  # A game is reported unhealthy by GET /health/sync when its last successful
  # sync is older than this. The scheduled sync runs daily, so this must exceed
  # 24h; external monitors (Healthchecks.io / UptimeRobot) page on the 503.
  freshness_max_age: 26h
